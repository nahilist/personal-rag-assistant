services:
  - type: web
    name: personal-rag-assistant
    runtime: python
    plan: free
    region: oregon
    buildCommand: ./build.sh
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PYTHONPATH
        value: apps/api:.
      - key: SUPABASE_URL
        value: https://rmcbmyvxthppakmmdlbl.supabase.co
      - key: SUPABASE_JWT_ISSUER
        value: https://rmcbmyvxthppakmmdlbl.supabase.co/auth/v1
      - key: SUPABASE_JWKS_URL
        value: https://rmcbmyvxthppakmmdlbl.supabase.co/auth/v1/.well-known/jwks.json
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://web-tau-black-73.vercel.app,http://localhost:3000
      - key: STORAGE_BACKEND
        value: local
      - key: LLM_PROVIDER
        value: mock
      - key: EMBEDDING_PROVIDER
        value: mock
